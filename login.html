{% extends 'base.html' %}{% block title %}دخول{% endblock %}{% block content %}<section class="panel"><h1>تسجيل الدخول</h1><form method="post">{{ form.hidden_tag() }}{% for f in [form.email,form.password] %}<label>{{ f.label }}{{ f(class_='control') }}{% for e in f.errors %}<small>{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_='button') }}</form><p>ليس لديك حساب؟ <a href="{{ url_for('register') }}">إنشاء حساب</a></p></section>{% endblock %}
