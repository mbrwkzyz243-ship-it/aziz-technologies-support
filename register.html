{% extends 'base.html' %}{% block title %}إنشاء حساب{% endblock %}{% block content %}<section class="panel"><h1>إنشاء حساب مستخدم</h1><form method="post">{{ form.hidden_tag() }}{% for f in [form.name,form.email,form.password,form.confirm] %}<label>{{ f.label }}{{ f(class_='control') }}{% for e in f.errors %}<small>{{ e }}</small>{% endfor %}</label>{% endfor %}{{ form.submit(class_='button') }}</form><p>لديك حساب؟ <a href="{{ url_for('login_view') }}">دخول</a></p></section>{% endblock %}
