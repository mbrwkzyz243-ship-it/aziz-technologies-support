services:
  - type: web
    name: aziz-technologies-support
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aziz-technologies-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: ENGINEER_EMAIL
        sync: false
      - key: ENGINEER_PASSWORD
        sync: false
databases:
  - name: aziz-technologies-db
    databaseName: aziz_support
    user: aziz_support_user
